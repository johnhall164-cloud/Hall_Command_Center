body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#000}
header{padding:12px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:5}
h1{margin:0;color:#0b2f6b;font-size:24px}
button{margin:4px;padding:10px 14px;border:1px solid #aaa;border-radius:8px;background:#f7f7f7;font-size:15px}
.wrap{overflow:auto;padding:18px}
.chart{min-width:1450px;position:relative}
.top{width:390px;margin:0 auto 45px auto;border:2px solid #000;border-radius:8px;background:#eef8ff;padding:12px}
.top:after{content:"";position:absolute;left:50%;top:168px;height:45px;border-left:3px solid #000}
.level1{display:grid;grid-template-columns:repeat(10,1fr);gap:16px;border-top:3px solid #000;padding-top:28px}
.col{position:relative}
.num{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:#0b2f6b;color:white;padding:6px 10px;border-radius:5px;font-weight:bold}
.col:before{content:"";position:absolute;top:-28px;left:50%;height:28px;border-left:3px solid #000}
.box{border:2px solid #000;border-radius:7px;background:#eef8ff;padding:8px;margin-bottom:22px;min-height:128px}
.child{margin-left:22px;min-height:105px}
label{font-size:12px;font-weight:bold;display:block;margin-top:4px}
input,textarea{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #777;background:transparent;font-size:12px}
textarea{height:26px;resize:vertical}
@media print{header{display:none}.wrap{overflow:visible}.chart{transform:scale(.62);transform-origin:top left}}
</style>

<script>
const KEY='hall_command_center_chart_v1';
function saveData(){
 const data={};
 document.querySelectorAll('[data-k]').forEach(el=>data[el.dataset.k]=el.value);
 localStorage.setItem(KEY,JSON.stringify(data));
}
function loadData(){
 const data=JSON.parse(localStorage.getItem(KEY)||'{}');
 document.querySelectorAll('[data-k]').forEach(el=>{el.value=data[el.dataset.k]||'';});
}
function clearData(){
 if(confirm('Clear all chart fields?')){
  document.querySelectorAll('[data-k]').forEach(el=>el.value='');
  localStorage.removeItem(KEY);
 }
}
async function sharePage(){
 saveData();
 if(navigator.share){await navigator.share({title:'HALL COMMAND CENTER',text:'HALL COMMAND CENTER chart'});}
 else{alert('Use your browser menu to share this file.');}
}
window.addEventListener('input',saveData);
loadData();
</script>
